          application/json:
            schema:
              $ref: "#/components/schemas/RequirementAnalysisIngest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementIngestResult"
        "400":
          description: Invalid body
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Unknown or disabled principal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Project outside the principal scope
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Unknown requirement externalId
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Requirement is not ANALYZING or NEEDS_CLARIFICATION
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /agent-runs/{id}:
    get:
      tags:
        - agent-runs
      summary: "Agent run detail: metadata, steps, timeline and decisions (FR-016, FR-017, FR-018)"
      description: Read-only for every role including viewer; the run must belong to a visible project. Steps (≤ 20) are the runtime's structured progress, the timeline (≤ 50) its events, decisions (≤ 50) carry action, bounded reason, confidence, policy outcome, optional risk level and typed evidence (≤ 20; accessible:false or no href renders as access-restricted). durationMs is finishedAt − startedAt, or now − startedAt while unfinished. A RUNNING|RETRYING run with no timeline activity for more than 30 minutes is shown as stale by the client (runFreshness), not re-stated. Live updates ride GET /inbox/stream filtered by workflowId. Not visible and unknown both return 404.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: *a13
          description: Agent run id
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunDetail"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Not found or not visible (403 and 404 are indistinguishable)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /integrations/jira/webhook:
    post:
      tags:
        - integrations
      summary: Inbound Jira issue webhook (FR-008)
      description: No session. The raw body (≤ 256 KB) is authenticated with x-hub-signature = sha256=<hex HMAC-SHA256(JIRA_WEBHOOK_SECRET, body)> compared in constant time before it is parsed. jira:issue_created / jira:issue_updated create or update the requirement of the project mapped to the Jira project key (source jira, externalRef). jira:issue_deleted or a transition into a done status flags the requirement and moves its linked workflow to BLOCKED. Unmapped projects and unknown events are ignored.
      security: []
      parameters:
        - name: x-hub-signature
          in: header
          required: true
          schema:
            type: string
            pattern: ^sha256=[0-9a-f]{64}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JiraWebhookEvent"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JiraWebhookResult"
        "400":
          description: Invalid event payload
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Missing or invalid signature, or webhook secret not configured
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: Body larger than 256 KB
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Rate limited (120 requests per minute per IP)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /reviews:
    get:
      tags:
        - reviews
      summary: Pull requests with AI reviews, newest activity first (US6, FR-025)
      description: Session user; every role including viewer. Bounded to 50 rows per page over the visible projects, ordered by updatedAt desc, id desc with an opaque keyset cursor. `state` filters by pull request status. Each row carries the derived readyForMerge / blockingOpenCount (FR-022) and the Review Center href.
      security:
        - sessionCookie: []
      parameters:
        - *a11
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum:
              - OPEN
              - MERGED
              - CLOSED
        - *a12
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewListResponse"
        "400":
          description: Invalid project, state or cursor
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /reviews/{pullRequestId}:
    get:
      tags:
        - reviews
      summary: "Review Center: latest review lanes, findings and fix-cycle history (FR-020, FR-022)"
      description: "Session user; read-only for every role including viewer (viewers see the actions disabled). Findings (≤ 50) carry severity, blocking class, bounded impact / recommended fix text and typed evidence (≤ 10; accessible:false or no href renders as access-restricted). readyForMerge is derived: false while any BLOCKING finding is OPEN or FIX_REQUESTED, and the client shows “Not ready for merge approval — N blocking findings open”. Live updates ride GET /inbox/stream filtered by the workflowId. Not visible and unknown both return 404."
      security:
        - sessionCookie: []
      parameters:
        - &a19
          name: pullRequestId
          in: path
          required: true
          schema: *a13
          description: Pull request id
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullRequestReviewView"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Not found or not visible (403 and 404 are indistinguishable)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /reviews/{pullRequestId}/findings/{findingId}/dismiss:
    post:
      tags:
        - reviews
      summary: Dismiss an OPEN finding with a reason (FR-021, FR-032)
      description: Engineer, approver or administrator. Sets the finding DISMISSED with the reason (≤ 240 chars), the actor and the time; writes an audit_events row (finding.dismissed) and an inbox_changed notification. Returns the finding and the recomputed readiness.
      security:
        - sessionCookie: []
      parameters:
        - *a19
        - &a20
          name: findingId
          in: path
          required: true
          schema: *a13
          description: Finding id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DismissFindingBody"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingActionResult"
        "400": &a21
          description: Invalid body (unknown key, missing or over-long reason)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401": &a22
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403": &a23
          description: Viewers are read-only (FR-032)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404": &a24
          description: Pull request or finding not found or not visible
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409": &a25
          description: Finding is not OPEN (already dismissed, fixed, fix requested or issue requested) — urn:cdevi:problem:invalid-transition
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /reviews/{pullRequestId}/findings/{findingId}/fix:
    post:
      tags:
        - reviews
      summary: Ask the agent to fix an OPEN finding (FR-021, AS-4)
      description: "Engineer, approver or administrator; the body is an empty strict object. In one transaction: joins the RUNNING review cycle of the pull request or creates the next one (iteration n+1, findingsCount = open findings now, fixedCount 0), marks the finding FIX_REQUESTED with fixCycleId, sets the workflow’s Review stage RUNNING with a reason, writes audit_events (finding.fix_requested) and notifies inbox_changed. The runtime reports real progress through PUT /ingest/pull-requests/{externalId}/cycles/{cycle}. 409 when the cycle budget (maxIterations) is exhausted or the finding is not OPEN."
      security:
        - sessionCookie: []
      parameters:
        - *a19
        - *a20
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyFixBody"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingActionResult"
        "400": *a21
        "401": *a22
        "403": *a23
        "404": *a24
        "409": *a25
  /reviews/{pullRequestId}/findings/{findingId}/issue:
    post:
      tags:
        - reviews
      summary: Record the intent to track an OPEN finding as an issue (FR-021)
      description: "Engineer, approver or administrator; the body is an empty strict object. Records intent only: the finding becomes ISSUE_REQUESTED with the actor and time, audit_events (finding.issue_requested) and inbox_changed. No outbound Jira call — Jira stays inbound-only."
      security:
        - sessionCookie: []
      parameters:
        - *a19
        - *a20
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssueBody"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingActionResult"
        "400": *a21
        "401": *a22
        "403": *a23
        "404": *a24
        "409": *a25
  /ingest/pull-requests/{externalId}:
    put:
      tags:
        - ingest
      summary: Runtime creates or updates the pull request of a workflow (FR-036)
      description: Bearer ingestion principal scoped to the workflow project. One pull request per workflow; the workflow and the optional requirement are resolved by externalId. Strict body. `stale` when observedAt is not newer than the stored watermark (nothing written). Never writes audit_events.
      security:
        - ingestionToken: []
      parameters:
        - *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PullRequestIngest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
        "400": *a3
        "401": *a4
        "403": *a5
        "404":
          description: Unknown workflow or requirement externalId
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /ingest/pull-requests/{externalId}/reviews/{cycle}:
    put:
      tags:
        - ingest
      summary: Runtime replaces the AI review of a cycle as a whole (FR-020, FR-018, FR-036)
      description: "Bearer ingestion principal scoped to the pull request project. Exactly seven distinct lane results and ≤ 50 findings (positions and externalIds unique, ≤ 10 typed evidence refs each). The body is strict: description / impact / recommendedFix are bounded summaries and any reasoning field (chainOfThought, reasoning, rationale, …) is a 400. Findings already DISMISSED, FIX_REQUESTED or ISSUE_REQUESTED by a human keep their state; the runtime flips findings to FIXED here. `stale` when observedAt is not newer than the stored watermark."
      security:
        - ingestionToken: []
      parameters:
        - *a2
        - &a26
          name: cycle
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: Review / fix cycle number (1-based, per pull request)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewIngest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
        "400":
          description: Invalid body (unknown key, bound exceeded, lane missing or duplicated)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401": *a4
        "403": *a5
        "404":
          description: Unknown pull request externalId
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Review is not accepting a replacement (concurrent replacement in progress)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /ingest/pull-requests/{externalId}/cycles/{cycle}:
    put:
      tags:
        - ingest
      summary: Runtime reports the progress of a fix cycle (AS-4, FR-036)
      description: Bearer ingestion principal scoped to the pull request project. Upserts the cycle counts, iteration and state (RUNNING → COMPLETED | FAILED | CANCELLED); fixedCount + remainingCount ≤ findingsCount. Strict body. `stale` when observedAt is not newer than the stored watermark. 409 when the cycle is already terminal.
      security:
        - ingestionToken: []
      parameters:
        - *a2
        - *a26
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewCycleIngest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
        "400":
          description: Invalid body (unknown key, inconsistent counts)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401": *a4
        "403": *a5
        "404":
          description: Unknown pull request externalId
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Cycle already COMPLETED, FAILED or CANCELLED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cdevi_session
    ingestionToken:
      type: http
      scheme: bearer
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - path
              - message
      required:
        - type
        - title
        - status
    WorkflowDetail:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
        workflow:
          type: object
          properties:
            id:
              type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            externalId:
              type: string
            title:
              type: string
            project:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                key:
                  type: string
                name:
                  type: string
              required:
                - id
                - key
                - name
            state:
              type: string
              enum:
                - QUEUED
                - RUNNING
                - RETRYING
                - WAITING
                - WAITING_FOR_HUMAN
                - BLOCKED
                - FAILED
                - COMPLETED
                - CANCELLED
            stateReason:
              nullable: true
              type: string
            stateObservedAt:
              type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
            agent:
              nullable: true
              type: string
            pullRequestRef:
              nullable: true
              type: string
            startedAt:
              nullable: true
              type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
            finishedAt:
              nullable: true
              type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
            elapsedMs:
