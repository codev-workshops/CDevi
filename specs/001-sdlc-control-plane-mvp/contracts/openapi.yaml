              position:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
              name:
                type: string
              state:
                type: string
                enum:
                  - QUEUED
                  - RUNNING
                  - RETRYING
                  - WAITING
                  - WAITING_FOR_HUMAN
                  - BLOCKED
                  - FAILED
                  - COMPLETED
                  - CANCELLED
              stateObservedAt:
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
              stateReason:
                nullable: true
                type: string
              agent:
                nullable: true
                type: string
              startedAt:
                nullable: true
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
              finishedAt:
                nullable: true
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
              elapsedMs:
                nullable: true
                type: integer
                minimum: 0
                maximum: 9007199254740991
              errorSummary:
                nullable: true
                type: string
              requiresApproval:
                type: boolean
              current:
                type: boolean
              agentRuns:
                default: []
                maxItems: 20
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                    agent:
                      type: string
                    state:
                      type: string
                      enum:
                        - QUEUED
                        - RUNNING
                        - RETRYING
                        - WAITING
                        - WAITING_FOR_HUMAN
                        - BLOCKED
                        - FAILED
                        - COMPLETED
                        - CANCELLED
                    stagePosition:
                      type: integer
                      minimum: 1
                      maximum: 9007199254740991
                  required:
                    - id
                    - agent
                    - state
                    - stagePosition
            required:
              - id
              - position
              - name
              - state
              - stateObservedAt
              - stateReason
              - agent
              - startedAt
              - finishedAt
              - elapsedMs
              - errorSummary
              - requiresApproval
              - current
        currentStage:
          nullable: true
          type: object
          properties:
            stage:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                position:
                  type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
                name:
                  type: string
              required:
                - id
                - position
                - name
            state:
