# GENERATED by `pnpm -F @cdevi/contracts openapi` from packages/contracts/src — do not edit by hand.
openapi: 3.1.0
info:
  title: CDevi API — Inbox Home Page (specs/003)
  version: 0.3.0
  description: Generated from Zod schemas in packages/contracts (`pnpm -F @cdevi/contracts openapi`) and snapshot-tested; edit the schemas, not the yaml. Users authenticate with a session cookie, ingestion principals with a Bearer token. Every error is a Problem. Every list is bounded to 50 items with keyset cursors.
servers:
  - url: /api
tags:
  - name: auth
  - name: inbox
  - name: ingest
  - name: health
paths:
  /auth/sign-in:
    post:
      tags:
        - auth
      summary: Sign in with email and password (FR-004)
      description: Rate-limited 5/min per IP+email. Wrong password and unknown email return the same 401 Problem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "204":
          description: "Signed in; Set-Cookie: cdevi_session (HttpOnly; Secure; SameSite=Lax; Path=/)"
        "400":
          description: Invalid body
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Email or password is incorrect
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many attempts
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/sign-out:
    post:
      tags:
        - auth
      summary: Revoke the current session
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Session revoked and cookie cleared
  /auth/me:
    get:
      tags:
        - auth
      summary: Current user, organization and visible projects (FR-003, FR-028)
      security:
        - sessionCookie: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /inbox:
    get:
      tags:
        - inbox
      summary: Inbox snapshot — counts, Today summary and one page of one tab (FR-006…FR-018, FR-026…FR-028)
      security:
        - sessionCookie: []
      parameters:
        - name: tab
          in: query
          schema:
            type: string
            enum:
              - needsYou
              - running
              - done
            default: needsYou
        - name: project
          in: query
          description: Project id or `all` (default). Must be visible to the user, else 404.
          schema:
            type: string
            default: all
        - name: cursor
          in: query
          description: Opaque keyset cursor from a previous nextCursor.
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxSnapshot"
          headers:
            Server-Timing:
              schema:
                type: string
              description: db;dur=…, total;dur=…
        "400":
          description: Invalid query or cursor
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Project not visible
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /inbox/stream:
    get:
      tags:
        - inbox
      summary: Server-Sent Events — inbox.changed notifications for visible projects (FR-019, SC-007)
      description: 'text/event-stream. Each event: id=<seq>, event=inbox.changed, data={"projectId","workflowId"}. Heartbeat comment every 25 s. Send Last-Event-ID on reconnect to replay missed events (≤ 24 h) once. Payloads carry no titles or asks — the client refetches GET /inbox.'
      security:
        - sessionCookie: []
      parameters:
        - name: Last-Event-ID
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /inbox/records/{kind}/{id}:
    get:
      tags:
        - inbox
      summary: Read-only record behind the /approvals/{id} and /workflows/{id} stubs (research R9)
      security:
        - sessionCookie: []
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum:
              - approvals
              - workflows
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
