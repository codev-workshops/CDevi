        "403": &a4
          description: Project outside the principal scope
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404": &a5
          description: Unknown project or workflow
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Illegal transition for the current state
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /ingest/workflows/{externalId}/transitions:
    post:
