name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        working-directory: packages/design-system
      - run: pnpm lint
      - run: pnpm lint:css
      - run: pnpm typecheck
      - run: pnpm check:classes
      - run: pnpm format:check

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cdevi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cdevi" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://app_user:app_user@localhost:5432/cdevi
      DATABASE_MIGRATOR_URL: postgres://migrator:migrator@localhost:5432/cdevi
      SESSION_SECRET: ci-only-session-secret-not-for-production-use-0000
      CDEVI_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: psql postgres://postgres:postgres@localhost:5432/cdevi -f packages/db/docker/init-roles.sql
      - run: pnpm db:migrate
      - run: pnpm build
        working-directory: packages/design-system
      - run: pnpm test
      - run: pnpm check:size

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm gallery:build
        working-directory: packages/design-system
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-dist
          path: packages/design-system/gallery-dist
          retention-days: 7

  visual:
    name: visual
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: packages/design-system
      - run: pnpm build && pnpm gallery:build
        working-directory: packages/design-system
      - run: pnpm test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/design-system/playwright-report
          retention-days: 7

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cdevi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cdevi" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://app_user:app_user@localhost:5432/cdevi
      DATABASE_MIGRATOR_URL: postgres://migrator:migrator@localhost:5432/cdevi
      SESSION_SECRET: ci-only-session-secret-not-for-production-use-0000
      CDEVI_ENV: test
      API_ORIGIN: http://localhost:3001
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: psql postgres://postgres:postgres@localhost:5432/cdevi -f packages/db/docker/init-roles.sql
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm build
      - run: pnpm test:e2e
      - run: pnpm perf:api
      - run: pnpm check:size
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-playwright-report
          path: apps/web/playwright-report
          retention-days: 7
